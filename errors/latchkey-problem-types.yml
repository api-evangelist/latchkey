    title: Conflict
    detail: >-
      Job is not in a submittable state — only a job in `created` may be submitted, so a
      failed or cancelled job can never be resubmitted.
    source_operations: [submitJob]
  - status: 429
    title: Rate Limited
    detail: Per-organization job creation quota exceeded (120 jobs per hour per workspace).
