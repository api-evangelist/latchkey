name: Latchkey Jobs API
description: >-
  Managed ephemeral GitHub Actions runners that repair failing builds mid-run. The Jobs API gives coding agents and CI
  systems direct access to a fresh Ubuntu 24.04 x86_64 runner that runs one command and is then destroyed, with a hosted
  MCP server, CLI, and llms.txt for agent-native access.
